name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Read package version
        id: metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/LocalAuth.App/LocalAuth.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a three-part release version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate translations
        run: python scripts/check-localization.py
      - name: Core regression checks
        run: dotnet run --project tests/LocalAuth.Tests -c Release
      - name: Windows UI and clipboard regression checks
        run: dotnet run --project tests/LocalAuth.Windows.Tests -c Release -r win-x64
      - name: Build portable archive and per-user installer
        shell: pwsh
        run: ./build.ps1 -Installer -SkipTests
      - name: Download previous published installer for upgrade testing
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $previous = ./scripts/Get-UpgradeBaseline.ps1 -Repository $env:GH_REPO -CurrentVersion $env:APP_VERSION
          "version=$($previous.Version)" >> $env:GITHUB_OUTPUT
          "path=$($previous.Path)" >> $env:GITHUB_OUTPUT
      - name: Test install, running-app block, upgrade and uninstall
        shell: pwsh
        env:
          BASELINE_INSTALLER: ${{ steps.baseline.outputs.path }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./tests/installer/Smoke.Tests.ps1 -Installer $env:BASELINE_INSTALLER -UpgradeInstaller "artifacts/packages/AuthLocal-$env:APP_VERSION-windows-x64-setup.exe" -ExpectedVersion $env:BASELINE_VERSION -UpgradeVersion $env:APP_VERSION
      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AuthLocal-${{ steps.metadata.outputs.version }}-windows-x64
          path: artifacts/packages/AuthLocal-${{ steps.metadata.outputs.version }}-*
          if-no-files-found: error
  release:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release AuthLocal for Windows ')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: AuthLocal-${{ needs.windows.outputs.version }}-windows-x64
          path: packages
      - name: Publish tested Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
          TEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($env:APP_VERSION) + '\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) { throw 'The release has no changelog entry.' }
          $notes = "AuthLocal for Windows $env:APP_VERSION`n`n" + $section.Groups[1].Value.Trim()
          $notes += "`n`n安装版下载 setup.exe；免安装版解压 portable.zip 后运行 AuthLocal.exe。更新前先从托盘退出旧版。"
          $notes += "`n`nCore, Windows UI/clipboard, localization and previous-release upgrade/uninstall checks passed before publication: $env:TEST_RUN_URL"
          $notes | Set-Content release-notes.txt -Encoding utf8
          $packages = @(Get-ChildItem packages -File | Select-Object -ExpandProperty FullName)
          gh release create "v$env:APP_VERSION" @packages --repo $env:GH_REPO --target $env:RELEASE_COMMIT --title "AuthLocal for Windows $env:APP_VERSION" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
